include = ["kde-builder", "kde_builder/**/*.py", "tests/**/*.py", "scripts/gen_zsh_completions.py"]

[lint]
preview = true
select = [
    "D",
    "E",
    "F401",
    "I",
    "N",
    "W",
    "TID252",
]

pydocstyle.convention = "google"

# See https://docs.astral.sh/ruff/rules/ for the list of rules
ignore = [
    "D100", # We do not document the modules (python files).
    "D102", # We do not always document methods.
    "D103", # We do not always document functions.
    "D105", # We do not always document magic methods.
    "D107", # We do not always document __init__ methods.
    "D203", # Just to be explicit. Already disabled by following google pydocstyle convention. We use D211 rule instead.
    "D212", # We use D213 rule instead, see below.
    "D406", # Just to be explicit. Already disabled by following google pydocstyle convention.
    "D407", # Just to be explicit. Already disabled by following google pydocstyle convention.
    "D413", # Just to be explicit. Already disabled by following google pydocstyle convention.
    "E501", # We use lines longer than "standard".
]

# Enable rules on top of google pydocstyle convention.
extend-select = [
    "D213", # Put the docstring summary on the second line.
    "D204", # Follow pep257 convention: add blank line after _class_ docstring.
    "D404", # Follow pep257 convention: do not start docstring with "this" word.
]

[lint.flake8-tidy-imports]
ban-relative-imports = "all"

[lint.isort]
force-single-line = true
